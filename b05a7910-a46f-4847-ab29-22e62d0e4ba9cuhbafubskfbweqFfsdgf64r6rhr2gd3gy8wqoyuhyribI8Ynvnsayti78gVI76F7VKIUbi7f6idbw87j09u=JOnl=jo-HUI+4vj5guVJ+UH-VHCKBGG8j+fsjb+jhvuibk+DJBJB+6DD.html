<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Form & Document Scanner</title>
    <!-- OpenCV.js for real-time document detection & enhancement -->
    <script async src="https://docs.opencv.org/4.x/opencv.js" type="text/javascript"></script>
    <style>
        :root {
            --primary-color: #002FBE;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #ccc;
            --error-color: #d9534f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-color);
            padding: 15px;
            padding-bottom: 40px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2, h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 5px;
        }

        .form-section {
            margin-bottom: 25px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        select:focus {
            border-color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group label {
            font-weight: normal;
        }

        /* Signature Canvas Style */
        .signature-container {
            border: 2px dashed var(--primary-color);
            border-radius: 6px;
            position: relative;
            background: #fafafa;
            touch-action: none;
        }

        canvas#sigCanvas {
            width: 100%;
            height: 180px;
            display: block;
        }

        .btn-clear {
            background-color: var(--error-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-submit:disabled {
            background-color: #88a1e2;
            cursor: not-allowed;
        }

        /* Custom Alert Modal */
        .alert-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .alert-modal.active {
            display: flex;
        }

        .alert-content {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 90%;
            width: 320px;
            text-align: center;
        }

        .alert-content h4 {
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        .alert-content p {
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .alert-content button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Application Form</h2>
    
    <form id="appForm">
        <!-- Basic Info Section -->
        <div class="form-section">
            <div class="grid-2">
                <div class="form-group">
                    <label for="currentDate">Application Date</label>
                    <input type="date" id="currentDate" required>
                </div>
                <div class="form-group">
                    <label for="branchName">Branch Name</label>
                    <input type="text" id="branchName" placeholder="Branch Name" required>
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="relationType">Relation Type</label>
                    <select id="relationType">
                        <option value="Father">Father</option>
                        <option value="Husband">Husband</option>
                        <option value="Guardian">Guardian</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="relationName">Relation Name</label>
                    <input type="text" id="relationName">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="birthDate">Date of Birth</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" readonly>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="uan">UAN Number</label>
                    <input type="text" id="uan">
                </div>
                <div class="form-group">
                    <label for="esic">ESIC Number</label>
                    <input type="text" id="esic">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="maritalStatus">Marital Status</label>
                    <select id="maritalStatus">
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="educationSelect">Education</label>
                    <select id="educationSelect">
                        <option value="10th Pass">10th Pass</option>
                        <option value="12th Pass">12th Pass</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Post Graduate">Post Graduate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>
                    <input type="text" id="bloodGroup" placeholder="e.g. O+">
                </div>
            </div>

            <div class="form-group">
                <label>Languages Known</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="languages" value="English"> English</label>
                    <label><input type="checkbox" name="languages" value="Hindi"> Hindi</label>
                    <label><input type="checkbox" name="languages" value="Regional"> Regional</label>
                </div>
                <input type="text" id="otherLanguage" placeholder="Other language (optional)" style="margin-top:5px;">
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="characterCert">Character Cert</label>
                    <input type="text" id="characterCert">
                </div>
                <div class="form-group">
                    <label for="medicalCategory">Medical Category</label>
                    <input type="text" id="medicalCategory">
                </div>
                <div class="form-group">
                    <label for="experience">Experience (Years)</label>
                    <input type="number" id="experience" min="0">
                </div>
            </div>
        </div>

        <!-- Official / Verification Details -->
        <h3>Official Details</h3>
        <div class="form-section">
            <div class="grid-3">
                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation">
                </div>
                <div class="form-group">
                    <label for="gunman">Gunman Status</label>
                    <select id="gunman">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gunValidity">Gun License Validity</label>
                    <input type="date" id="gunValidity">
                </div>
            </div>

            <div class="grid-3">
                <div class="form-group">
                    <label for="pvStatus">Police Verification</label>
                    <select id="pvStatus">
                        <option value="Applied">Applied</option>
                        <option value="Valid">Valid</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="date" id="pvDate" style="display:none; margin-top: 22px;">
                </div>
                <div class="form-group">
                    <label for="doj">Date of Joining</label>
                    <input type="date" id="doj">
                </div>
            </div>

            <div class="form-group">
                <label for="interviewedBy">Interviewed By</label>
                <input type="text" id="interviewedBy">
            </div>
        </div>

        <!-- Permanent Address -->
        <h3>Permanent Address</h3>
        <div class="form-section">
            <div class="grid-3">
                <div class="form-group"><label>Village</label><input type="text" id="pVillage"></div>
                <div class="form-group"><label>Post</label><input type="text" id="pPost"></div>
                <div class="form-group"><label>Taluka</label><input type="text" id="pTaluka"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>District</label><input type="text" id="pDistrict"></div>
                <div class="form-group"><label>State</label><input type="text" id="pState"></div>
                <div class="form-group"><label>Pincode</label><input type="text" id="pPin"></div>
            </div>
            <div class="form-group"><label>Contact No.</label><input type="tel" id="pContact"></div>
        </div>

        <!-- Present Address -->
        <h3>Local / Present Address</h3>
        <div class="form-section">
            <div class="grid-3">
                <div class="form-group"><label>Village/Locality</label><input type="text" id="lVillage"></div>
                <div class="form-group"><label>Post</label><input type="text" id="lPost"></div>
                <div class="form-group"><label>Taluka</label><input type="text" id="lTaluka"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>District</label><input type="text" id="lDistrict"></div>
                <div class="form-group"><label>State</label><input type="text" id="lState"></div>
                <div class="form-group"><label>Pincode</label><input type="text" id="lPin"></div>
            </div>
            <div class="form-group"><label>Contact No.</label><input type="tel" id="lContact"></div>
        </div>

        <!-- Guarantors & Family -->
        <h3>Guarantors & Family Details</h3>
        <div class="form-section">
            <div class="grid-2">
                <div class="form-group"><label>Guarantor 1 Name</label><input type="text" id="gName1"></div>
                <div class="form-group"><label>Guarantor 1 Occupation</label><input type="text" id="gOcc1"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Guarantor 2 Name</label><input type="text" id="gName2"></div>
                <div class="form-group"><label>Guarantor 2 Occupation</label><input type="text" id="gOcc2"></div>
            </div>

            <div class="grid-3">
                <div class="form-group"><label>Family Member 1</label><input type="text" id="fName1"></div>
                <div class="form-group"><label>DOB</label><input type="date" id="fBirth1"></div>
                <div class="form-group"><label>Relation</label><input type="text" id="fRel1"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>Family Member 2</label><input type="text" id="fName2"></div>
                <div class="form-group"><label>DOB</label><input type="date" id="fBirth2"></div>
                <div class="form-group"><label>Relation</label><input type="text" id="fRel2"></div>
            </div>
        </div>

        <!-- Previous Employment -->
        <h3>Previous Employment</h3>
        <div class="form-section">
            <div class="grid-3">
                <div class="form-group"><label>Company Name 1</label><input type="text" id="prevName1"></div>
                <div class="form-group"><label>DOJ</label><input type="date" id="prevDoj1"></div>
                <div class="form-group"><label>DOE</label><input type="date" id="prevDoe1"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Reason for Leaving</label><input type="text" id="prevReason1"></div>
                <div class="form-group"><label>Remark</label><input type="text" id="prevRemark1"></div>
            </div>

            <div class="grid-3">
                <div class="form-group"><label>Company Name 2</label><input type="text" id="prevName2"></div>
                <div class="form-group"><label>DOJ</label><input type="date" id="prevDoj2"></div>
                <div class="form-group"><label>DOE</label><input type="date" id="prevDoe2"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Reason for Leaving</label><input type="text" id="prevReason2"></div>
                <div class="form-group"><label>Remark</label><input type="text" id="prevRemark2"></div>
            </div>
        </div>

        <!-- Identification & Banking Details -->
        <h3>Identification & Bank Info</h3>
        <div class="form-section">
            <div class="grid-2">
                <div class="form-group"><label>Aadhaar Number</label><input type="text" id="aadharNumber"></div>
                <div class="form-group"><label>Name on Aadhaar</label><input type="text" id="aadharName"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>PAN Number</label><input type="text" id="panNumber"></div>
                <div class="form-group"><label>Name on PAN</label><input type="text" id="panName"></div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label>Bank Account No.</label><input type="text" id="bankAccount"></div>
                <div class="form-group"><label>IFSC Code</label><input type="text" id="ifscCode"></div>
                <div class="form-group"><label>Name as per Bank</label><input type="text" id="bankingName"></div>
            </div>
        </div>

        <!-- Document Attachments (Camera Auto-Detection Capable) -->
        <h3>Document Attachments (Tap to Scan or Upload)</h3>
        <div class="form-section">
            <div class="grid-2">
                <div class="form-group">
                    <label for="poi">Proof of Identity (Aadhaar Front / POI)</label>
                    <input type="file" id="poi">
                </div>
                <div class="form-group">
                    <label for="poa">Proof of Address (Aadhaar Back / POA)</label>
                    <input type="file" id="poa">
                </div>
            </div>
            <div class="grid-2">
                <div class="form-group">
                    <label for="pan">PAN Card Attachment</label>
                    <input type="file" id="pan">
                </div>
                <div class="form-group">
                    <label for="passbook">Bank Passbook / Cheque</label>
                    <input type="file" id="passbook">
                </div>
            </div>
            <div class="grid-3">
                <div class="form-group"><label for="photo">Photo</label><input type="file" id="photo"></div>
                <div class="form-group"><label for="pv">Police Verification Doc</label><input type="file" id="pv"></div>
                <div class="form-group"><label for="gunLc">Gun License Doc</label><input type="file" id="gunLc"></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label for="education">Education Cert</label><input type="file" id="education"></div>
                <div class="form-group"><label for="medical">Medical Cert</label><input type="file" id="medical"></div>
            </div>
        </div>

        <!-- Canvas Signature -->
        <h3>Applicant Signature</h3>
        <div class="form-section">
            <div class="signature-container">
                <canvas id="sigCanvas" width="400" height="180"></canvas>
            </div>
            <button type="button" id="clearSigBtn" class="btn-clear">Clear Signature</button>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Submit Application</button>
    </form>
</div>

<!-- Custom Mobile Alert Modal -->
<div id="customAlert" class="alert-modal">
    <div class="alert-content">
        <h4 id="alertTitle">Notification</h4>
        <p id="alertMessage">Message</p>
        <button onclick="closeCustomAlert()">OK</button>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzLte400hALhrMJphmCQAIx0eDaa-X1u6Yy3txfOV-NuaZ95iDRPTIVXFZ31DxcvoAxHg/exec";

    // --- WAKE LOCK API (PREVENT PHONE SLEEP / LOCK) ---
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.log(`Wake Lock Error: ${err.name}, ${err.message}`);
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    }

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') {
            await requestWakeLock();
        }
    });

    // --- CUSTOM MOBILE ALERT MODAL ---
    function showCustomAlert(message, title = "Notification") {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerText = message;
        document.getElementById('customAlert').classList.add('active');
    }

    function closeCustomAlert() {
        document.getElementById('customAlert').classList.remove('active');
    }

    function setInitialDates() {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('currentDate').value = todayStr;
        const dojInput = document.getElementById('doj');
        if (dojInput) {
            dojInput.value = todayStr;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        setInitialDates();
        requestWakeLock();
    });

    // --- BIRTH DATE TO AGE CALCULATION ---
    document.getElementById('birthDate').addEventListener('change', function() {
        const birthDate = new Date(this.value);
        if (isNaN(birthDate)) return;
        const todayDate = new Date();
        let age = todayDate.getFullYear() - birthDate.getFullYear();
        const m = todayDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && todayDate.getDate() < birthDate.getDate())) {
            age--;
        }
        document.getElementById('age').value = age >= 0 ? age : 0;
    });

    // --- POLICE VERIFICATION CONDITIONAL FIELD ---
    document.getElementById('pvStatus').addEventListener('change', function() {
        const dateInput = document.getElementById('pvDate');
        if (this.value === 'Valid') {
            dateInput.style.display = 'block';
            dateInput.required = true;
        } else {
            dateInput.style.display = 'none';
            dateInput.required = false;
            dateInput.value = '';
        }
    });

    // --- CANVAS SIGNATURE PAD LOGIC ---
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSigned = false;

    ctx.strokeStyle = "#002FBE";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        hasSigned = true;
        const pos = getMousePos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.cancelable) e.preventDefault();
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getMousePos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSigned = false;
    }

    document.getElementById('clearSigBtn').addEventListener('click', clearSignature);

    // --- DOCUMENT CAMERA SCANNER & AUTO-CAPTURE LOGIC ---
    const scannedAttachments = {};
    let activeStream = null;
    let scanInterval = null;

    async function startCameraScan(fieldId) {
        await requestWakeLock();

        if (typeof cv === 'undefined' || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            triggerNativeCaptureFallback(fieldId);
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            activeStream = stream;
            processStreamForDocument(stream, fieldId);
        } catch (err) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                activeStream = stream;
                processStreamForDocument(stream, fieldId);
            } catch (e) {
                triggerNativeCaptureFallback(fieldId);
            }
        }
    }

    function triggerNativeCaptureFallback(fieldId) {
        const input = document.getElementById(fieldId);
        input.setAttribute("accept", "image/*");
        input.setAttribute("capture", "environment");
        input.click();
    }

    function processStreamForDocument(stream, fieldId) {
        const video = document.createElement('video');
        video.srcObject = stream;
        video.play();

        const procCanvas = document.createElement('canvas');
        const procCtx = procCanvas.getContext('2d');
        let steadyFrames = 0;

        scanInterval = setInterval(() => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                procCanvas.width = video.videoWidth;
                procCanvas.height = video.videoHeight;
                procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);

                let src = cv.imread(procCanvas);
                let gray = new cv.Mat();
                let blurred = new cv.Mat();
                let edges = new cv.Mat();
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();

                cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
                cv.Canny(blurred, edges, 75, 200);

                cv.findContours(edges, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

                let foundDoc = false;
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);

                    if (approx.rows === 4 && cv.contourArea(cnt) > (src.rows * src.cols * 0.25)) {
                        foundDoc = true;
                        approx.delete();
                        break;
                    }
                    approx.delete();
                }

                if (foundDoc) {
                    steadyFrames++;
                    if (steadyFrames >= 15) {
                        stopCameraScan();
                        const cleanedImageBase64 = enhanceDocumentImage(procCanvas);
                        scannedAttachments[fieldId] = { data: cleanedImageBase64, type: "image/jpeg" };
                        showCustomAlert(`Document captured and auto-cleaned successfully for ${fieldId.toUpperCase()}.`, "Auto Capture Success");
                    }
                } else {
                    steadyFrames = 0;
                }

                src.delete(); gray.delete(); blurred.delete();
                edges.delete(); contours.delete(); hierarchy.delete();
            }
        }, 100);
    }

    function stopCameraScan() {
        if (scanInterval) clearInterval(scanInterval);
        if (activeStream) {
            activeStream.getTracks().forEach(track => track.stop());
            activeStream = null;
        }
    }

    function enhanceDocumentImage(sourceCanvas) {
        const outCanvas = document.createElement('canvas');
        outCanvas.width = sourceCanvas.width;
        outCanvas.height = sourceCanvas.height;
        const outCtx = outCanvas.getContext('2d');

        outCtx.drawImage(sourceCanvas, 0, 0);
        const imgData = outCtx.getImageData(0, 0, outCanvas.width, outCanvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            avg = avg < 110 ? avg * 0.8 : Math.min(255, avg * 1.15);
            data[i] = avg;
            data[i + 1] = avg;
            data[i + 2] = avg;
        }
        outCtx.putImageData(imgData, 0, 0);
        return outCanvas.toDataURL("image/jpeg", 0.85);
    }

    const attachmentIds = ['poi', 'poa', 'pan', 'passbook', 'photo', 'pv', 'gunLc', 'education', 'medical'];
    attachmentIds.forEach(id => {
        const inputElem = document.getElementById(id);
        if (inputElem) {
            inputElem.addEventListener('click', (e) => {
                if (/Android|iPhone|iPad/i.test(navigator.userAgent)) {
                    e.preventDefault();
                    startCameraScan(id);
                }
            });
        }
    });

    // --- FILE UTILITY ---
    const toBase64 = file => new Promise((resolve, reject) => {
        if (!file) resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ data: reader.result, type: file.type });
        reader.onerror = error => reject(error);
    });

    // --- FORM SUBMIT LOGIC ---
    document.getElementById('appForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!hasSigned) {
            showCustomAlert("Please draw your signature before submitting.", "Required");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = "Submitting... Please wait";
        await requestWakeLock();

        try {
            const signatureBase64 = canvas.toDataURL("image/png");

            let langArray = [];
            document.querySelectorAll('input[name="languages"]:checked').forEach(cb => {
                langArray.push(cb.value);
            });
            const manualLang = document.getElementById('otherLanguage').value.trim();
            if (manualLang) langArray.push(manualLang);

            const pvSel = document.getElementById('pvStatus').value;
            const pvFormatted = pvSel === 'Valid' ? `Valid: ${document.getElementById('pvDate').value}` : 'Applied';

            const getAttachment = async (fieldId) => {
                if (scannedAttachments[fieldId]) {
                    return scannedAttachments[fieldId];
                }
                const fileInput = document.getElementById(fieldId);
                if (fileInput && fileInput.files[0]) {
                    return await toBase64(fileInput.files[0]);
                }
                return null;
            };

            const payload = {
                currentDate: document.getElementById('currentDate').value,
                branchName: document.getElementById('branchName').value,
                firstName: document.getElementById('firstName').value,
                middleName: document.getElementById('middleName').value,
                lastName: document.getElementById('lastName').value,
                relationType: document.getElementById('relationType').value,
                relationName: document.getElementById('relationName').value,
                birthDate: document.getElementById('birthDate').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                uan: document.getElementById('uan').value,
                esic: document.getElementById('esic').value,
                maritalStatus: document.getElementById('maritalStatus').value,
                educationText: document.getElementById('educationSelect').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                languages: langArray.join(', '),
                characterCert: document.getElementById('characterCert').value,
                medicalCategory: document.getElementById('medicalCategory').value,
                experience: document.getElementById('experience').value,
                
                designation: document.getElementById('designation').value,
                gunman: document.getElementById('gunman').value,
                gunValidity: document.getElementById('gunValidity').value,
                policeVerification: pvFormatted,
                interviewedBy: document.getElementById('interviewedBy').value,
                doj: document.getElementById('doj').value,

                pVillage: document.getElementById('pVillage').value,
                pPost: document.getElementById('pPost').value,
                pTaluka: document.getElementById('pTaluka').value,
                pDistrict: document.getElementById('pDistrict').value,
                pState: document.getElementById('pState').value,
                pPin: document.getElementById('pPin').value,
                pContact: document.getElementById('pContact').value,

                lVillage: document.getElementById('lVillage').value,
                lPost: document.getElementById('lPost').value,
                lTaluka: document.getElementById('lTaluka').value,
                lDistrict: document.getElementById('lDistrict').value,
                lState: document.getElementById('lState').value,
                lPin: document.getElementById('lPin').value,
                lContact: document.getElementById('lContact').value,

                gName1: document.getElementById('gName1').value,
                gOcc1: document.getElementById('gOcc1').value,
                gName2: document.getElementById('gName2').value,
                gOcc2: document.getElementById('gOcc2').value,

                fName1: document.getElementById('fName1').value,
                fBirth1: document.getElementById('fBirth1').value,
                fRel1: document.getElementById('fRel1').value,
                fName2: document.getElementById('fName2').value,
                fBirth2: document.getElementById('fBirth2').value,
                fRel2: document.getElementById('fRel2').value,

                prevName1: document.getElementById('prevName1').value,
                prevDoj1: document.getElementById('prevDoj1').value,
                prevDoe1: document.getElementById('prevDoe1').value,
                prevReason1: document.getElementById('prevReason1').value,
                prevRemark1: document.getElementById('prevRemark1').value,
                prevName2: document.getElementById('prevName2').value,
                prevDoj2: document.getElementById('prevDoj2').value,
                prevDoe2: document.getElementById('prevDoe2').value,
                prevReason2: document.getElementById('prevReason2').value,
                prevRemark2: document.getElementById('prevRemark2').value,

                aadharNumber: document.getElementById('aadharNumber').value,
                aadharName: document.getElementById('aadharName').value,
                panNumber: document.getElementById('panNumber').value,
                panName: document.getElementById('panName').value,
                bankAccount: document.getElementById('bankAccount').value,
                ifscCode: document.getElementById('ifscCode').value,
                bankingName: document.getElementById('bankingName').value,

                signature: { data: signatureBase64, type: "image/png" },
                photo: await getAttachment('photo'),
                poi: await getAttachment('poi'),
                poa: await getAttachment('poa'),
                pan: await getAttachment('pan'),
                passbook: await getAttachment('passbook'),
                pv: await getAttachment('pv'),
                gunLc: await getAttachment('gunLc'),
                education: await getAttachment('education'),
                medical: await getAttachment('medical')
            };

            const response = await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            
            if (result.status === 'success') {
                showCustomAlert('Success! Your PDF document has been generated.', 'Success');
                if (result.pdfUrl) {
                    window.open(result.pdfUrl, '_blank');
                }
                
                document.getElementById('appForm').reset();
                clearSignature();
                document.getElementById('pvDate').style.display = 'none';
                setInitialDates();

            } else {
                showCustomAlert('Error processing document: ' + (result.message || 'Unknown error'), 'Error');
            }

        } catch (error) {
            console.error(error);
            showCustomAlert('An error occurred: ' + error.message, 'Error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = "Submit Application";
            releaseWakeLock();
        }
    });
</script>
</body>
</html>
