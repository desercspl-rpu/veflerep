<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application & Document Upload</title>
    <style>
        :root {
            --primary-color: #002FBE;
            --primary-hover: #002288;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2, h3 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.95rem;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .checkbox-group label {
            font-weight: normal;
            font-size: 0.9rem;
        }

        /* Signature Canvas Styling */
        .canvas-container {
            border: 2px dashed var(--primary-color);
            border-radius: 5px;
            display: inline-block;
            background: #fff;
            margin-top: 10px;
        }

        canvas {
            touch-action: none;
            cursor: crosshair;
        }

        .btn {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            margin-top: 20px;
        }

        /* Custom Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 10px;
        }

        .modal-content p {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Application & Document Upload Form</h2>
    <form id="appForm">
        
        <!-- General Details -->
        <div class="section">
            <h3>General Information</h3>
            <div class="grid">
                <div class="form-group">
                    <label for="currentDate">Application Date</label>
                    <input type="date" id="currentDate" readonly>
                </div>
                <div class="form-group">
                    <label for="branchName">Branch Name</label>
                    <input type="text" id="branchName" required>
                </div>
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="middleName">Middle Name</label>
                    <input type="text" id="middleName">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="relationType">Relation Type</label>
                    <select id="relationType">
                        <option value="Father">Father</option>
                        <option value="Husband">Husband</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="relationName">Relative Name</label>
                    <input type="text" id="relationName">
                </div>
                <div class="form-group">
                    <label for="birthDate">Date of Birth</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" readonly>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="uan">UAN Number</label>
                    <input type="text" id="uan">
                </div>
                <div class="form-group">
                    <label for="esic">ESIC Number</label>
                    <input type="text" id="esic">
                </div>
                <div class="form-group">
                    <label for="maritalStatus">Marital Status</label>
                    <select id="maritalStatus">
                        <option value="Single">Single</option>
                        <option value="Married">Married</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="educationSelect">Education</label>
                    <select id="educationSelect">
                        <option value="10th Pass">10th Pass</option>
                        <option value="12th Pass">12th Pass</option>
                        <option value="Graduate">Graduate</option>
                        <option value="Post Graduate">Post Graduate</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>
                    <input type="text" id="bloodGroup">
                </div>
                <div class="form-group">
                    <label for="characterCert">Character Certificate</label>
                    <input type="text" id="characterCert">
                </div>
                <div class="form-group">
                    <label for="medicalCategory">Medical Category</label>
                    <input type="text" id="medicalCategory">
                </div>
                <div class="form-group">
                    <label for="experience">Experience (Years)</label>
                    <input type="number" id="experience" value="0">
                </div>
            </div>

            <div class="form-group" style="margin-top:15px;">
                <label>Languages Known</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="languages" value="English"> English</label>
                    <label><input type="checkbox" name="languages" value="Hindi"> Hindi</label>
                    <label><input type="checkbox" name="languages" value="Local"> Local Language</label>
                </div>
                <input type="text" id="otherLanguage" placeholder="Other languages" style="margin-top:5px;">
            </div>
        </div>

        <!-- Official Info -->
        <div class="section">
            <h3>Official & Verification Details</h3>
            <div class="grid">
                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation">
                </div>
                <div class="form-group">
                    <label for="gunman">Gunman License (Yes/No)</label>
                    <select id="gunman">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="gunValidity">Gun License Validity</label>
                    <input type="date" id="gunValidity">
                </div>
                <div class="form-group">
                    <label for="pvStatus">Police Verification Status</label>
                    <select id="pvStatus">
                        <option value="Applied">Applied</option>
                        <option value="Valid">Valid</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="date" id="pvDate" style="display:none;" placeholder="PV Expiry Date">
                </div>
                <div class="form-group">
                    <label for="interviewedBy">Interviewed By</label>
                    <input type="text" id="interviewedBy">
                </div>
                <div class="form-group">
                    <label for="doj">Date of Joining</label>
                    <input type="date" id="doj">
                </div>
            </div>
        </div>

        <!-- Permanent Address -->
        <div class="section">
            <h3>Permanent Address</h3>
            <div class="grid">
                <div class="form-group"><label>Village</label><input type="text" id="pVillage"></div>
                <div class="form-group"><label>Post</label><input type="text" id="pPost"></div>
                <div class="form-group"><label>Taluka</label><input type="text" id="pTaluka"></div>
                <div class="form-group"><label>District</label><input type="text" id="pDistrict"></div>
                <div class="form-group"><label>State</label><input type="text" id="pState"></div>
                <div class="form-group"><label>Pincode</label><input type="text" id="pPin"></div>
                <div class="form-group"><label>Contact</label><input type="text" id="pContact"></div>
            </div>
        </div>

        <!-- Local Address -->
        <div class="section">
            <h3>Local Address</h3>
            <div class="grid">
                <div class="form-group"><label>Village</label><input type="text" id="lVillage"></div>
                <div class="form-group"><label>Post</label><input type="text" id="lPost"></div>
                <div class="form-group"><label>Taluka</label><input type="text" id="lTaluka"></div>
                <div class="form-group"><label>District</label><input type="text" id="lDistrict"></div>
                <div class="form-group"><label>State</label><input type="text" id="lState"></div>
                <div class="form-group"><label>Pincode</label><input type="text" id="lPin"></div>
                <div class="form-group"><label>Contact</label><input type="text" id="lContact"></div>
            </div>
        </div>

        <!-- Guarantees & Family -->
        <div class="section">
            <h3>Guarantors Information</h3>
            <div class="grid">
                <div class="form-group"><label>Guarantor 1 Name</label><input type="text" id="gName1"></div>
                <div class="form-group"><label>Guarantor 1 Occupation</label><input type="text" id="gOcc1"></div>
                <div class="form-group"><label>Guarantor 2 Name</label><input type="text" id="gName2"></div>
                <div class="form-group"><label>Guarantor 2 Occupation</label><input type="text" id="gOcc2"></div>
            </div>
        </div>

        <div class="section">
            <h3>Family Details</h3>
            <div class="grid">
                <div class="form-group"><label>Member 1 Name</label><input type="text" id="fName1"></div>
                <div class="form-group"><label>Member 1 DOB</label><input type="date" id="fBirth1"></div>
                <div class="form-group"><label>Member 1 Relation</label><input type="text" id="fRel1"></div>
                <div class="form-group"><label>Member 2 Name</label><input type="text" id="fName2"></div>
                <div class="form-group"><label>Member 2 DOB</label><input type="date" id="fBirth2"></div>
                <div class="form-group"><label>Member 2 Relation</label><input type="text" id="fRel2"></div>
            </div>
        </div>

        <!-- Previous Work Experience -->
        <div class="section">
            <h3>Previous Employment</h3>
            <div class="grid">
                <div class="form-group"><label>Company 1</label><input type="text" id="prevName1"></div>
                <div class="form-group"><label>DOJ 1</label><input type="date" id="prevDoj1"></div>
                <div class="form-group"><label>DOE 1</label><input type="date" id="prevDoe1"></div>
                <div class="form-group"><label>Reason 1</label><input type="text" id="prevReason1"></div>
                <div class="form-group"><label>Remark 1</label><input type="text" id="prevRemark1"></div>
                
                <div class="form-group"><label>Company 2</label><input type="text" id="prevName2"></div>
                <div class="form-group"><label>DOJ 2</label><input type="date" id="prevDoj2"></div>
                <div class="form-group"><label>DOE 2</label><input type="date" id="prevDoe2"></div>
                <div class="form-group"><label>Reason 2</label><input type="text" id="prevReason2"></div>
                <div class="form-group"><label>Remark 2</label><input type="text" id="prevRemark2"></div>
            </div>
        </div>

        <!-- Identity & Banking Details -->
        <div class="section">
            <h3>Identity & Financial Details</h3>
            <div class="grid">
                <div class="form-group"><label>Aadhaar Number</label><input type="text" id="aadharNumber"></div>
                <div class="form-group"><label>Name on Aadhaar</label><input type="text" id="aadharName"></div>
                <div class="form-group"><label>PAN Number</label><input type="text" id="panNumber"></div>
                <div class="form-group"><label>Name on PAN</label><input type="text" id="panName"></div>
                <div class="form-group"><label>Bank Account No.</label><input type="text" id="bankAccount"></div>
                <div class="form-group"><label>IFSC Code</label><input type="text" id="ifscCode"></div>
                <div class="form-group"><label>Name in Bank</label><input type="text" id="bankingName"></div>
            </div>
        </div>

        <!-- Attachments Section -->
        <div class="section">
            <h3>Document Attachments</h3>
            <div class="grid">
                <div class="form-group"><label>Passport Photo</label><input type="file" id="photo" accept="image/*" capture="user"></div>
                <div class="form-group"><label>Proof of Identity (POI)</label><input type="file" id="poi" accept="image/*"></div>
                <div class="form-group"><label>Proof of Address (POA)</label><input type="file" id="poa" accept="image/*"></div>
                <div class="form-group"><label>PAN Card Image</label><input type="file" id="pan" accept="image/*"></div>
                <div class="form-group"><label>Bank Passbook/Check</label><input type="file" id="passbook" accept="image/*"></div>
                <div class="form-group"><label>Police Verification Doc</label><input type="file" id="pv" accept="image/*"></div>
                <div class="form-group"><label>Gun License Doc</label><input type="file" id="gunLc" accept="image/*"></div>
                <div class="form-group"><label>Education Cert</label><input type="file" id="education" accept="image/*"></div>
                <div class="form-group"><label>Medical Cert</label><input type="file" id="medical" accept="image/*"></div>
            </div>
        </div>

        <!-- Signature Pad -->
        <div class="section">
            <h3>Applicant Signature</h3>
            <div class="canvas-container">
                <canvas id="sigCanvas" width="350" height="150"></canvas>
            </div>
            <br>
            <button type="button" id="clearSigBtn" class="btn btn-secondary" style="margin-top:8px;">Clear Signature</button>
        </div>

        <button type="submit" id="submitBtn" class="btn submit-btn">Submit Application</button>
    </form>
</div>

<!-- Modal Alert Dialog -->
<div id="customAlert" class="modal">
    <div class="modal-content">
        <h3 id="alertTitle">Notification</h3>
        <p id="alertMessage"></p>
        <button class="btn" onclick="closeCustomAlert()">OK</button>
    </div>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzLte400hALhrMJphmCQAIx0eDaa-X1u6Yy3txfOV-NuaZ95iDRPTIVXFZ31DxcvoAxHg/exec";

    // --- SCREEN WAKE LOCK UTILITY ---
    let wakeLock = null;
    async function requestWakeLock() {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        } catch (err) {
            console.warn(`Wake Lock Error: ${err.name}, ${err.message}`);
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            wakeLock.release().then(() => {
                wakeLock = null;
            });
        }
    }

    // --- CUSTOM MOBILE ALERT MODAL ---
    function showCustomAlert(message, title = "Notification") {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertMessage').innerText = message;
        document.getElementById('customAlert').classList.add('active');
    }

    function closeCustomAlert() {
        document.getElementById('customAlert').classList.remove('active');
    }

    function setInitialDates() {
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('currentDate').value = todayStr;
        const dojInput = document.getElementById('doj');
        if (dojInput) {
            dojInput.value = todayStr;
        }
    }

    document.addEventListener("DOMContentLoaded", setInitialDates);

    // --- BIRTH DATE TO AGE CALCULATION ---
    document.getElementById('birthDate').addEventListener('change', function() {
        const birthDate = new Date(this.value);
        if (isNaN(birthDate)) return;
        const todayDate = new Date();
        let age = todayDate.getFullYear() - birthDate.getFullYear();
        const m = todayDate.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && todayDate.getDate() < birthDate.getDate())) {
            age--;
        }
        document.getElementById('age').value = age >= 0 ? age : 0;
    });

    // --- POLICE VERIFICATION CONDITIONAL FIELD ---
    document.getElementById('pvStatus').addEventListener('change', function() {
        const dateInput = document.getElementById('pvDate');
        if (this.value === 'Valid') {
            dateInput.style.display = 'block';
            dateInput.required = true;
        } else {
            dateInput.style.display = 'none';
            dateInput.required = false;
            dateInput.value = '';
        }
    });

    // --- CANVAS SIGNATURE PAD LOGIC ---
    const canvas = document.getElementById('sigCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let hasSigned = false;

    ctx.strokeStyle = "#002FBE";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        hasSigned = true;
        const pos = getMousePos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        if (e.cancelable) e.preventDefault();
    }

    function draw(e) {
        if (!isDrawing) return;
        const pos = getMousePos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        if (e.cancelable) e.preventDefault();
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    function clearSignature() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasSigned = false;
    }

    document.getElementById('clearSigBtn').addEventListener('click', clearSignature);

    // --- ADVANCED CAMERA CAPTURE, STABILITY DETECTION, & AUTO-CROP ---
    async function captureAndCropDocument(fileInput, isFrontCamera = false) {
        return new Promise((resolve, reject) => {
            const constraints = {
                video: {
                    facingMode: isFrontCamera ? "user" : "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;

            navigator.mediaDevices.getUserMedia(constraints).then(stream => {
                video.srcObject = stream;
                
                // Stability & Clarity auto-capture check loop
                let stableFrames = 0;
                let lastData = null;
                const checkCanvas = document.createElement('canvas');
                const checkCtx = checkCanvas.getContext('2d');

                const checkInterval = setInterval(() => {
                    if (video.videoWidth === 0) return;
                    checkCanvas.width = 100;
                    checkCanvas.height = 100;
                    checkCtx.drawImage(video, 0, 0, 100, 100);
                    const currentData = checkCtx.getImageData(0, 0, 100, 100).data;

                    if (lastData) {
                        let diff = 0;
                        for (let i = 0; i < currentData.length; i += 4) {
                            diff += Math.abs(currentData[i] - lastData[i]);
                        }
                        // Low pixel delta indicates camera stability
                        if (diff < 150000) {
                            stableFrames++;
                        } else {
                            stableFrames = 0;
                        }
                    }
                    lastData = currentData;

                    // Trigger capture upon achieving steady focus (approx 1.5s stability)
                    if (stableFrames >= 5) {
                        clearInterval(checkInterval);
                        
                        // Execute capture and process image
                        const captureCanvas = document.createElement('canvas');
                        const capCtx = captureCanvas.getContext('2d');

                        // Automatic edge crop (center 85% area)
                        const cropX = video.videoWidth * 0.075;
                        const cropY = video.videoHeight * 0.075;
                        const cropW = video.videoWidth * 0.85;
                        const cropH = video.videoHeight * 0.85;

                        captureCanvas.width = cropW;
                        captureCanvas.height = cropH;
                        capCtx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                        stream.getTracks().forEach(track => track.stop());
                        
                        resolve({
                            data: captureCanvas.toDataURL('image/jpeg', 0.85),
                            type: 'image/jpeg'
                        });
                    }
                }, 300);

            }).catch(err => {
                reject(err);
            });
        });
    }

    // --- FILE UTILITY ---
    const toBase64 = async (fileInput, isPassportPhoto = false) => {
        if (!fileInput || !fileInput.files || !fileInput.files[0]) return null;
        
        const file = fileInput.files[0];
        
        // If image file, run automatic clean-up and standard auto-crop canvas pass
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Auto-crop margins for optimal framing
                    const cropMargin = isPassportPhoto ? 0.02 : 0.05;
                    const cropX = img.width * cropMargin;
                    const cropY = img.height * cropMargin;
                    const cropW = img.width * (1 - (cropMargin * 2));
                    const cropH = img.height * (1 - (cropMargin * 2));

                    canvas.width = cropW;
                    canvas.height = cropH;
                    ctx.drawImage(img, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                    resolve({
                        data: canvas.toDataURL('image/jpeg', 0.85),
                        type: 'image/jpeg'
                    });
                };
            };
            reader.onerror = error => reject(error);
        });
    };

    // --- FORM SUBMIT LOGIC ---
    document.getElementById('appForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (!hasSigned) {
            showCustomAlert("Please draw your signature before submitting.", "Required");
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        
        // Lock Screen & Prevent Sleep Mode
        await requestWakeLock();

        // Disable immediately and set submitting text directly on button
        submitBtn.disabled = true;
        submitBtn.innerHTML = "Submitting... Keep screen active";

        try {
            const signatureBase64 = canvas.toDataURL("image/png");

            let langArray = [];
            document.querySelectorAll('input[name="languages"]:checked').forEach(cb => {
                langArray.push(cb.value);
            });
            const manualLang = document.getElementById('otherLanguage').value.trim();
            if (manualLang) langArray.push(manualLang);

            const pvSel = document.getElementById('pvStatus').value;
            const pvFormatted = pvSel === 'Valid' ? `Valid: ${document.getElementById('pvDate').value}` : 'Applied';

            const payload = {
                currentDate: document.getElementById('currentDate').value,
                branchName: document.getElementById('branchName').value,
                firstName: document.getElementById('firstName').value,
                middleName: document.getElementById('middleName').value,
                lastName: document.getElementById('lastName').value,
                relationType: document.getElementById('relationType').value,
                relationName: document.getElementById('relationName').value,
                birthDate: document.getElementById('birthDate').value,
                age: document.getElementById('age').value,
