<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Powered ID Scanner & Auto-Fill</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-md">
        <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">AI Vision ID Scanner</h2>

        <!-- Camera Preview Section -->
        <div class="relative bg-black rounded-lg overflow-hidden mb-4 flex items-center justify-center h-64">
            <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvasElement" class="hidden"></canvas>
            <div id="loadingOverlay" class="absolute inset-0 bg-black bg-opacity-60 flex flex-col items-center justify-center text-white hidden">
                <svg class="animate-spin h-8 w-8 text-white mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span class="text-sm font-medium">Processing with AI Vision...</span>
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="flex gap-2 mb-6">
            <button onclick="startCamera()" class="flex-1 bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg hover:bg-gray-900 transition">
                Start Camera
            </button>
            <button id="captureBtn" onclick="captureAndSendToAI()" disabled class="flex-1 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
                Capture & Scan
            </button>
        </div>

        <!-- Auto-Fill Form -->
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Extracted Name</label>
                <input type="text" id="fullName" placeholder="Auto-filled via AI" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth (DOB)</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ID Reference</label>
                <input type="text" id="idNumber" placeholder="[Redacted / Reference]" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50">
            </div>
        </form>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const captureBtn = document.getElementById('captureBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        let currentStream = null;

        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                video.srcObject = currentStream;
                captureBtn.disabled = false;
            } catch (err) {
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = currentStream;
                    captureBtn.disabled = false;
                } catch (fallbackErr) {
                    alert("Camera access denied or unavailable.");
                }
            }
        }

        function captureAndSendToAI() {
            if (!video.srcObject) return;

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg');

            loadingOverlay.classList.remove('hidden');

            // Yahan aapko apne Backend Server (Node.js/Python) ko call karna hoga 
            // jo OpenAI Vision API ya Google Cloud Vision API par image bhej kar JSON data return karega.
            
            // Example Fetch to Backend:
            /*
            fetch('/api/scan-id', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Image })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('fullName').value = data.name;
                document.getElementById('dob').value = data.dob;
                document.getElementById('idNumber').value = data.idNumber;
                loadingOverlay.classList.add('hidden');
            })
            .catch(err => {
                loadingOverlay.classList.add('hidden');
                alert("Failed to process image.");
            });
            */
        }
    </script>
</body>
</html>
