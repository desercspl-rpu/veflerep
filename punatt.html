<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera ID Scanner & Auto-Fill</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js CDN for OCR -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-md">
        <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">Live Camera ID Scanner</h2>

        <!-- Camera Preview Section -->
        <div class="relative bg-black rounded-lg overflow-hidden mb-4 flex items-center justify-center h-64">
            <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvasElement" class="hidden"></canvas>
            <div id="loadingOverlay" class="absolute inset-0 bg-black bg-opacity-60 flex flex-col items-center justify-center text-white hidden">
                <svg class="animate-spin h-8 w-8 text-white mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
                <span id="loadingText" class="text-sm font-medium">Processing OCR...</span>
            </div>
        </div>

        <!-- Camera Controls -->
        <div class="flex gap-2 mb-6">
            <button id="startCamBtn" onclick="startCamera()" class="flex-1 bg-gray-800 text-white font-semibold py-2 px-4 rounded-lg hover:bg-gray-900 transition">
                Start Camera
            </button>
            <button id="captureBtn" onclick="captureAndScan()" disabled class="flex-1 bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                Capture & Scan
            </button>
        </div>

        <!-- Auto-Fill Form -->
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Extracted Name</label>
                <input type="text" id="fullName" placeholder="Will be filled automatically" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date of Birth (DOB)</label>
                <input type="text" id="dob" placeholder="DD/MM/YYYY" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ID Number / Reference</label>
                <input type="text" id="idNumber" placeholder="[ID Redacted / Placeholder]" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
            </div>
        </form>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const captureBtn = document.getElementById('captureBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        let currentStream = null;

        // Rear camera access function
        async function startCamera() {
            try {
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: { exact: "environment" } // Forces rear camera
                    }
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                captureBtn.disabled = false;
            } catch (err) {
                // Fallback agar exact environment camera na mile toh koi bhi available camera khol de
                try {
                    const fallbackConstraints = { video: true };
                    currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
                    video.srcObject = currentStream;
                    captureBtn.disabled = false;
                } catch (fallbackErr) {
                    alert("Camera access denied or not supported on this device/browser.");
                    console.error(fallbackErr);
                }
            }
        }

        // Capture image from video stream and run OCR
        function captureAndScan() {
            if (!video.srcObject) return;

            // Set canvas dimensions to match video stream
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert canvas image to Data URL
            const imageDataUrl = canvas.toDataURL('image/png');

            // Show Loading Spinner
            loadingOverlay.classList.remove('hidden');
            loadingText.innerText = "Recognizing text...";

            // Run Tesseract OCR on captured image
            Tesseract.recognize(
                imageDataUrl,
                'eng',
                {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const progress = Math.round(m.progress * 100);
                            loadingText.innerText = `Scanning... ${progress}%`;
                        }
                    }
                }
            ).then(({ data: { text } }) => {
                loadingOverlay.classList.add('hidden');
                console.log("Raw OCR Text:", text);
                
                // Parse extracted text
                parseText(text);
            }).catch(err => {
                loadingOverlay.classList.add('hidden');
                console.error(err);
                alert("Error during OCR processing.");
            });
        }

        // Parse extracted text using Regex to find Name and DOB
        function parseText(text) {
            // 1. DOB Regex search (matches formats like DD/MM/YYYY, DD-MM-YYYY)
            const dobRegex = /\b(0[1-9]|[12][0-9]|3[01])[\/\-](0[1-9]|1[012])[\/\-](19|20)\d\d\b/;
            const dobMatch = text.match(dobRegex);
            if (dobMatch) {
                document.getElementById('dob').value = dobMatch[0];
            }

            // 2. Simple heuristic parsing or fallback cleaning can be added here for names
            // Note: Real-world card layouts vary, so regex matching for names depends heavily on clean framing.
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
            if (lines.length > 0) {
                // Assuming one of the first readable clean lines is the name
                document.getElementById('fullName').value = lines[0]; 
            }
        }
    </script>
</body>
</html>
