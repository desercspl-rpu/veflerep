<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asset Management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .header {
      background: #1f2937;
      color: white;
      padding: 18px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card .label {
      font-size: 13px;
      color: #6b7280;
    }

    .card .value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .panel {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
    }

    button {
      border: 0;
      padding: 10px 15px;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      padding: 11px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #f9fafb;
      font-weight: 600;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .Available {
      background: #dcfce7;
      color: #166534;
    }

    .Assigned {
      background: #dbeafe;
      color: #1e40af;
    }

    .UnderMaintenance {
      background: #fef3c7;
      color: #92400e;
    }

    .Damaged,
    .Lost {
      background: #fee2e2;
      color: #991b1b;
    }

    .Retired {
      background: #e5e7eb;
      color: #374151;
    }

    .message {
      padding: 15px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      .header {
        padding: 15px;
      }

      .container {
        margin-top: 15px;
      }

      .card .value {
        font-size: 23px;
      }

      .panel {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Asset Management System</h1>
  </div>

  <div class="container">

    <div id="errorBox" class="message error"></div>

    <div class="cards">
      <div class="card">
        <div class="label">Total Assets</div>
        <div class="value" id="totalAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Available</div>
        <div class="value" id="availableAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Assigned</div>
        <div class="value" id="assignedAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Under Maintenance</div>
        <div class="value" id="maintenanceAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Damaged</div>
        <div class="value" id="damagedAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Lost</div>
        <div class="value" id="lostAssets">0</div>
      </div>

      <div class="card">
        <div class="label">Retired</div>
        <div class="value" id="retiredAssets">0</div>
      </div>
    </div>

    <div class="panel">

      <div class="panel-header">
        <h2>IT Assets</h2>
        <button onclick="loadAssets()">Refresh</button>
      </div>

      <div id="loading" class="loading">
        Loading assets...
      </div>

      <div class="table-wrap">
        <table id="assetTable" style="display:none;">
          <thead>
            <tr>
              <th>Asset ID</th>
              <th>Asset Tag</th>
              <th>Asset Type</th>
              <th>Brand</th>
              <th>Model</th>
              <th>Serial Number</th>
              <th>Status</th>
              <th>Location</th>
              <th>Department</th>
            </tr>
          </thead>

          <tbody id="assetBody"></tbody>
        </table>
      </div>

    </div>

  </div>


  <script>

    /*
      IMPORTANT:
      Replace this URL with your Power Automate HTTP trigger URL.
    */

    const API_URL = "https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/46efdd64086b4ddf9cd9e341b13bb880/triggers/manual/paths/invoke?api-version=1";


    async function loadAssets() {

      const loading = document.getElementById("loading");
      const table = document.getElementById("assetTable");
      const body = document.getElementById("assetBody");
      const errorBox = document.getElementById("errorBox");

      loading.style.display = "block";
      table.style.display = "none";
      errorBox.style.display = "none";

      body.innerHTML = "";

      try {

        const response = await fetch(API_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            action: "getAssets"
          })
        });


        if (!response.ok) {
          throw new Error(
            "API Error: " + response.status
          );
        }


        const result = await response.json();

        console.log("API Response:", result);


        /*
          Power Automate response expected:

          {
            success: true,
            data: [...]
          }
        */

        const assets = result.data || [];


        updateDashboard(assets);

        renderAssets(assets);


        loading.style.display = "none";
        table.style.display = "table";

      }

      catch (error) {

        console.error(error);

        loading.style.display = "none";

        errorBox.innerText =
          "Unable to load assets. Please check the API connection.";

        errorBox.style.display = "block";
      }
    }


    function updateDashboard(assets) {

      document.getElementById("totalAssets").innerText =
        assets.length;


      document.getElementById("availableAssets").innerText =
        countStatus(assets, "Available");


      document.getElementById("assignedAssets").innerText =
        countStatus(assets, "Assigned");


      document.getElementById("maintenanceAssets").innerText =
        countStatus(assets, "Under Maintenance");


      document.getElementById("damagedAssets").innerText =
        countStatus(assets, "Damaged");


      document.getElementById("lostAssets").innerText =
        countStatus(assets, "Lost");


      document.getElementById("retiredAssets").innerText =
        countStatus(assets, "Retired");
    }


    function countStatus(assets, status) {

      return assets.filter(asset => {

        return getField(asset, "Status") === status;

      }).length;
    }


    function renderAssets(assets) {

      const body = document.getElementById("assetBody");

      body.innerHTML = "";


      if (!assets.length) {

        body.innerHTML = `
          <tr>
            <td colspan="9" style="text-align:center;">
              No assets found
            </td>
          </tr>
        `;

        return;
      }


      assets.forEach(asset => {

        const assetId =
          getField(asset, "Asset ID");

        const assetTag =
          getField(asset, "Asset Tag");

        const assetType =
          getField(asset, "Asset Type");

        const brand =
          getField(asset, "Brand");

        const model =
          getField(asset, "Model");

        const serial =
          getField(asset, "Serial Number");

        const status =
          getField(asset, "Status");

        const location =
          getField(asset, "Asset Location") ||
          getField(asset, "Location");

        const department =
          getField(asset, "Asset Department") ||
          getField(asset, "Department");


        const statusClass =
          status.replace(/\s/g, "");


        const row = document.createElement("tr");


        row.innerHTML = `

          <td>${escapeHtml(assetId)}</td>

          <td>${escapeHtml(assetTag)}</td>

          <td>${escapeHtml(assetType)}</td>

          <td>${escapeHtml(brand)}</td>

          <td>${escapeHtml(model)}</td>

          <td>${escapeHtml(serial)}</td>

          <td>
            <span class="status ${statusClass}">
              ${escapeHtml(status)}
            </span>
          </td>

          <td>${escapeHtml(location)}</td>

          <td>${escapeHtml(department)}</td>

        `;


        body.appendChild(row);

      });
    }


    function getField(asset, fieldName) {

      /*
        Supports normal SharePoint
        Power Automate JSON objects.
      */

      if (!asset) return "";

      if (asset[fieldName] !== undefined) {

        return formatValue(asset[fieldName]);
      }

      return "";
    }


    function formatValue(value) {

      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "object") {

        if (value.Value !== undefined) {
          return value.Value;
        }

        if (value.Title !== undefined) {
          return value.Title;
        }

        return JSON.stringify(value);
      }

      return String(value);
    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /*
      Load assets when page opens.
    */

    window.addEventListener(
      "DOMContentLoaded",
      loadAssets
    );

  </script>

</body>
</html>
