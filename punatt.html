<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IT Asset Management</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.hidden{
    display:none !important;
}

button{
    cursor:pointer;
}

.header{
    background:#111827;
    color:white;
    padding:15px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-title{
    font-size:21px;
    font-weight:bold;
}

.user-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:20px;
}

/* LOGIN */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:400px;
    max-width:100%;
    background:white;
    padding:30px;
    border-radius:14px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.login-box h2{
    text-align:center;
    margin:0 0 25px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:10px 12px;
    border:1px solid #d1d5db;
    border-radius:7px;
    font-size:14px;
    outline:none;
    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    font-weight:bold;
    font-size:13px;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-secondary{
    background:#6b7280;
    color:white;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.login-btn{
    width:100%;
    margin-top:5px;
}

.error{
    color:#dc2626;
    margin-top:12px;
    font-size:13px;
}

.success{
    color:#15803d;
    margin-top:12px;
    font-size:13px;
}

/* DASHBOARD */

.page-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.page-title h2{
    margin:0;
}

.page-title p{
    margin:5px 0 0;
    color:#6b7280;
    font-size:13px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card-title{
    color:#6b7280;
    font-size:13px;
}

.card-value{
    margin-top:7px;
    font-size:28px;
    font-weight:bold;
}

/* TOOLBAR */

.toolbar{
    background:white;
    padding:15px;
    border-radius:10px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search{
    flex:1;
    min-width:250px;
}

/* TABLE */

.table-container{
    background:white;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

table{
    width:100%;
    min-width:1250px;
    border-collapse:collapse;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:12px;
}

th{
    background:#f9fafb;
    font-weight:bold;
    white-space:nowrap;
}

.actions{
    display:flex;
    gap:5px;
}

.small-btn{
    padding:6px 9px;
    font-size:11px;
}

.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.available{
    background:#dcfce7;
    color:#166534;
}

.assigned{
    background:#dbeafe;
    color:#1e40af;
}

.returned{
    background:#fef3c7;
    color:#92400e;
}

.removed{
    background:#fee2e2;
    color:#991b1b;
}

.other{
    background:#e5e7eb;
    color:#374151;
}

.loading{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:9999;
}

.modal-box{
    background:white;
    width:900px;
    max-width:100%;
    max-height:95vh;
    overflow:auto;
    border-radius:12px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h3{
    margin:0;
}

.close{
    font-size:28px;
    cursor:pointer;
    color:#6b7280;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1 / -1;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

/* MESSAGE */

.message{
    position:fixed;
    right:20px;
    bottom:20px;
    max-width:350px;
    background:#111827;
    color:white;
    padding:13px 18px;
    border-radius:8px;
    display:none;
    z-index:20000;
}

@media(max-width:800px){

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

@media(max-width:550px){

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .container{
        padding:10px;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .login-box{
        padding:22px;
    }

}
</style>
</head>

<body>


<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <h2>IT Asset Management</h2>

        <div class="form-group">

            <label>User ID</label>

            <input
                id="userId"
                type="text"
                placeholder="Enter User ID"
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter Password"
                autocomplete="current-password"
            >

        </div>


        <button
            id="loginBtn"
            class="btn btn-primary login-btn"
            onclick="loginUser()"
        >
            Login
        </button>


        <div id="loginError"></div>

    </div>

</div>


<!-- =====================================================
APPLICATION
===================================================== -->

<div id="app" class="hidden">

    <div class="header">

        <div class="header-title">
            IT Asset Management
        </div>


        <div class="user-info">

            <span id="userName"></span>

    </div>


    <div class="container">


        <!-- TITLE -->

        <div class="page-title">

            <div>

                <h2>Asset Dashboard</h2>

                    Manage IT assets
                </p>

            </div>


            <button
                class="btn btn-success"

        </div>


        <!-- CARDS -->

        <div class="cards">

                </div>

                <div
                    id="totalAssets"

                    0

            </div>


            <div class="card">

                <div class="card-title">
                    Available

                <div
                    id="availableAssets"

            </div>


            <div class="card">

                <div class="card-title">
                    Assigned
                </div>

                <div

                    0
                </div>

            </div>


            <div class="card">

                    Removed
                </div>

                <div
                    id="removedAssets"

                    0
                </div>

        </div>


        <!-- TOOLBAR -->

        <div class="toolbar">

            <input
                id="search"
                class="search"

            >


            <select

            >

                <option value="">

                <option value="Available">
                    Available
                </option>

                <option value="Assigned">
                    Assigned
                </option>

                <option value="Returned">
                    Returned
                </option>

                <option value="Removed">
                    Removed

            </select>


            <button
                class="btn btn-primary"

                Refresh

        </div>


        <!-- TABLE -->

        <div class="table-container">

            <div
                id="loading"
                class="loading"
            >
                Loading assets...
            </div>


            <table
                id="assetTable"
                class="hidden"
            >

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Asset ID</th>
                        <th>Asset Tag</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Serial Number</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Condition</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="assetBody"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- =====================================================
ASSET MODAL
===================================================== -->

<div
    id="assetModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-header">

            <h3 id="modalTitle">
                Add Asset
            </h3>

            <span
                class="close"
                onclick="closeAssetModal()"

                &times;
            </span>

        </div>


        <input

        <div class="form-grid">

                <label>Asset ID *</label>

                <input

            </div>


            <div class="form-group">

                <input

            </div>


            <div class="form-group">

                <label>Brand *</label>

            </div>


            <div class="form-group">

                <label>Model *</label>

            <div class="form-group">

            </div>


            <div class="form-group">

                <label>Purchase Date</label>

            </div>


            <div class="form-group">

                <label>Purchase Cost</label>

                <input
                    id="PurchaseCost"

            </div>


            <div class="form-group">

                <label>Warranty Start</label>

                <input
                    id="WarrantyStart"
                    type="date"
                >

            </div>


            <div class="form-group">

                <label>Warranty End</label>

                <input
                    id="WarrantyEnd"
                    type="date"
                >

            </div>


            <div class="form-group">

                <label>Status</label>

                <select id="Status">

                    <option>Available</option>
                    <option>Assigned</option>
                    <option>Returned</option>

                </select>

            </div>


            <div class="form-group">

                <label>Condition</label>

                <select id="Condition">

                    <option>New</option>
                    <option>Good</option>
                    <option>Fair</option>
                    <option>Poor</option>

                </select>

            </div>


            <div class="form-group">

                <label>Asset Category</label>

                <select id="AssetCategory">

                    <option>Laptop</option>
                    <option>Desktop</option>
                    <option>Monitor</option>
                    <option>Printer</option>
                    <option>Mobile</option>
                    <option>Tablet</option>
                    <option>Network</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>Asset Location</label>

                <input
                    id="AssetLocation"
                    placeholder="Head Office"
                >

            </div>


            <div class="form-group">

                <label>Asset Vendor</label>

                <input
                    id="AssetVendor"
                >

            </div>


            <div class="form-group">

                <label>Asset Department</label>

                <input
                    id="AssetDepartment"
                >

            </div>


            <div class="form-group full">

        <div class="modal-footer">

            <button
                class="btn btn-secondary"

            <button

                onclick="saveAsset()"

                Save Asset
            </button>

        </div>

    </div>

</div>


<div id="message" class="message"></div>


<script>

/* =========================================================
   POWER AUTOMATE URLs
   COPY EXACT URLs FROM YOUR EXISTING FLOWS
========================================================= */

const LOGIN_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/382c1f3775a94fbcb1ab9874e2fab95f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=msJRa_nx4WGByT8aJNQoi-a3j1818bl_vVC_xV1H_mE";


const GET_ASSETS_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/46efdd64086b4ddf9cd9e341b13bb880/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oRsQsA92R3Ajybn3NQGPNnyWB3JaOEeGnX6qDCAhSb8";


const ADD_ASSET_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/8eaed4c3a0f54577952bfe9b97c87968/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=vxFwTKRoT9eyLNAzb_J_FXnYXqlMtm1cCEGjSU-LeXw";


const UPDATE_ASSET_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/e6151d7a9a4747789d0b8913069569e3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yUZy7wczskVTlLFrzin7jlVD07-lgOc9sh6sYZ9Wu6w";


const REMOVE_ASSET_URL =
"Phttps://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/344acde135574fabb4a31bc2c445847e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t-ttWl_mRRYxEC02e-mQAkF9gXPJ_piFrEZlRgxUP_I";

/* =========================================================
   VARIABLES
========================================================= */

let assets = [];

let editMode = false;


/* =========================================================
   LOGIN
========================================================= */

async function loginUser(){

    const userId =
        document.getElementById("userId").value.trim();

    const password =
        document.getElementById("password").value;

    const btn =
        document.getElementById("loginBtn");

    const error =
        document.getElementById("loginError");


    error.innerHTML = "";


    if(!userId || !password){

        error.className = "error";

        error.innerText =
            "Please enter User ID and Password.";

        return;
    }


    btn.disabled = true;

    btn.innerText = "Checking...";


    try{

        /*
         IMPORTANT:
         Keep this request identical to your
         existing Login Flow contract.
        */

        const response =
            await fetch(
                LOGIN_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":"application/json",
                        "Accept":"application/json"
                    },

                    body:JSON.stringify({

                        action:"login",

                        UserID:userId,

                        Password:password

                    })
                }
            );


        const raw =
            await response.text();


        console.log(
            "LOGIN STATUS:",
            response.status
        );

        console.log(
            "LOGIN RAW:",
            raw
        );


        if(!response.ok){

            throw new Error(
                "Login HTTP Status: " +
                response.status
            );
        }


        let result;

        try{

            result =
                JSON.parse(raw);

        }catch(e){

            throw new Error(
                "Invalid JSON returned by Login Flow."
            );
        }


        /*
         Handles both:
         {
            success:true,
            user:{}
         }

         and:
         {
            body:{
               success:true,
               user:{}
            }
         }
        */

        if(
            result.body &&
            typeof result.body === "object"
        ){

            result =
                result.body;

        }


        if(
            result.success !== true
        ){

            throw new Error(
                result.message ||
                "Invalid User ID or Password."
            );
        }


        const user =
            result.user ||
            result.data ||
            {};


        document.getElementById(
            "userName"
        ).innerText =
            user.Name ||
            user.name ||
            user.UserID ||
            userId;


        document.getElementById(
            "loginPage"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "app"
        ).classList.remove(
            "hidden"
        );


        await loadAssets();

    }
    catch(error){

        console.error(
            "Login Error:",
            error
        );


        error = error.message ||
                "Login failed.";


        const box =
            document.getElementById(
                "loginError"
            );


        box.className =
            "error";


        box.innerText =
            error;

    }
    finally{

        btn.disabled = false;

        btn.innerText = "Login";

    }

}


/* =========================================================
   LOAD ASSETS
========================================================= */

async function loadAssets(){

    const loading =
        document.getElementById(
            "loading"
        );

    const table =
        document.getElementById(
            "assetTable"
        );


    loading.classList.remove(
        "hidden"
    );

    table.classList.add(
        "hidden"
    );


    try{

        const response =
            await fetch(
                GET_ASSETS_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:JSON.stringify({
                        action:"getAssets"
                    })
                }
            );


        const raw =
            await response.text();


        console.log(
            "ASSET HTTP STATUS:",
            response.status
        );

        console.log(
            "ASSET RESPONSE:",
            raw
        );


        if(!response.ok){

            throw new Error(
                "Assets HTTP Status: " +
                response.status
            );
        }


        let result =
            JSON.parse(raw);


        /*
         Your backend currently returns:

         {
           statusCode:200,
           body:{
             success:true,
             data:[]
           }
         }

         This code handles that format.
        */

        if(
            result.body &&
            typeof result.body === "object"
        ){

            result =
                result.body;

        }


        if(
            result.success === true &&
            Array.isArray(result.data)
        ){

            assets =
                result.data;

        }

        else if(
            Array.isArray(result.value)
        ){

            assets =
                result.value;

        }

        else{

            assets = [];

        }


        renderAssets(
            assets
        );

        updateDashboard(
            assets
        );

    }
    catch(error){

        console.error(
            "loadAssets:",
            error
        );


        showMessage(
            error.message,
            true
        );

    }
    finally{

        loading.classList.add(
            "hidden"
        );

        table.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   SHAREPOINT CHOICE VALUE
========================================================= */

function valueOf(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    if(
        typeof value === "object"
    ){

        return value.Value ||
               value.value ||
               value.Title ||
               "";

    }


    return value;

}


/* =========================================================
   RENDER
========================================================= */

function renderAssets(
    list
){

    const body =
        document.getElementById(
            "assetBody"
        );


    body.innerHTML = "";


    if(!list.length){

        body.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    style="text-align:center;padding:30px"
                >
                    No assets found
                </td>

            </tr>

        `;

        return;

    }


    list.forEach(
        asset => {

            const status =
                valueOf(
                    asset.Status
                );


            const condition =
                valueOf(
                    asset.Condition
                );


            const category =
                valueOf(
                    asset.AssetCategory
                );


            const location =
                valueOf(
                    asset.AssetLocation
                );


            const department =
                valueOf(
                    asset.AssetDepartment
                );


            const tr =
                document.createElement(
                    "tr"
                );


            tr.innerHTML = `

                <td>${safe(asset.ID)}</td>

                <td>
                    <strong>
                        ${safe(asset.AssetID)}
                    </strong>
                </td>

                <td>
                    ${safe(asset.AssetTag)}
                </td>

                <td>
                    ${safe(asset.Brand)}
                </td>

                <td>
                    ${safe(asset.Model)}
                </td>

                <td>
                    ${safe(asset.SerialNumber)}
                </td>

                <td>
                    ${safe(category)}
                </td>

                <td>
                    ${safe(location)}
                </td>

                <td>
                    ${safe(department)}
                </td>

                <td>
                    ${statusBadge(status)}
                </td>

                <td>
                    ${safe(condition)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn btn-warning small-btn"
                            onclick="editAsset(${Number(asset.ID)})"
                        >
                            Edit
                        </button>


                        <button
                            class="btn btn-danger small-btn"
                            onclick="removeAsset(${Number(asset.ID)})"
                        >
                            Remove
                        </button>

                    </div>

                </td>

            `;


            body.appendChild(tr);

        }
    );

}


/* =========================================================
   STATUS
========================================================= */

function statusBadge(
    status
){

    const s =
        String(status || "")
        .toLowerCase();


    let cls = "other";


    if(s === "available")
        cls = "available";

    if(s === "assigned")
        cls = "assigned";

    if(s === "returned")
        cls = "returned";

    if(s === "removed")
        cls = "removed";


    return `
        <span class="badge ${cls}">
            ${safe(status)}
        </span>
    `;

}

/* =========================================================
   SEARCH
========================================================= */

function filterAssets(){

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        assets.filter(
            asset => {

                const text = [

                    asset.AssetID,
                    asset.AssetTag,
                    asset.Brand,
                    asset.Model,
                    asset.SerialNumber,
                    valueOf(asset.AssetCategory),
                    valueOf(asset.AssetLocation),
                    valueOf(asset.AssetDepartment)

                ]
                .join(" ")
                .toLowerCase();


                return (
                    text.includes(search)
                    &&
                    (
                        !status ||
                        valueOf(
                            asset.Status
                        ) === status
                    )
                );

            }
        );


    renderAssets(
        filtered
    );

}

/* =========================================================
   SAVE / UPDATE
========================================================= */

async function saveAsset(){

    const btn =
        document.getElementById(
            "saveBtn"
        );


    const data = {

        ID:
            document.getElementById(
                "recordId"
            ).value,

        AssetID:
            document.getElementById(
                "AssetID"
            ).value.trim(),

        AssetTag:
            document.getElementById(
                "AssetTag"
            ).value.trim(),

        Brand:
            document.getElementById(
                "Brand"
            ).value.trim(),

        Model:
            document.getElementById(
                "Model"
            ).value.trim(),

        SerialNumber:
            document.getElementById(
                "SerialNumber"
            ).value.trim(),

        PurchaseDate:
            document.getElementById(
                "PurchaseDate"
            ).value,

        PurchaseCost:
            document.getElementById(
                "PurchaseCost"
            ).value,

        WarrantyStart:
            document.getElementById(
                "WarrantyStart"
            ).value,

        WarrantyEnd:
            document.getElementById(
                "WarrantyEnd"
            ).value,

        Status:
            document.getElementById(
                "Status"
            ).value,

        Condition:
            document.getElementById(
                "Condition"
            ).value,

        AssetCategory:
            document.getElementById(
                "AssetCategory"
            ).value,

        AssetLocation:
            document.getElementById(
                "AssetLocation"
            ).value.trim(),

        AssetVendor:
            document.getElementById(
                "AssetVendor"
            ).value.trim(),

        AssetDepartment:
            document.getElementById(
                "AssetDepartment"
            ).value.trim(),

        Remarks:
            document.getElementById(
                "Remarks"
            ).value.trim()

    };


    if(
        !data.AssetID ||
        !data.AssetTag ||
        !data.Brand ||
        !data.Model ||
        !data.SerialNumber
    ){

        showMessage(
            "Fill all required fields.",
            true
        );

        return;

    }


    btn.disabled = true;


    try{

        const url =
            editMode
            ? UPDATE_ASSET_URL
            : ADD_ASSET_URL;


        const request = {

            action:
                editMode
                ? "updateAsset"
                : "addAsset",

            ...data

        };


        const response =
            await fetch(
                url,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            request
                        )
                }
            );


        const raw =
            await response.text();


        console.log(
            "SAVE RESPONSE:",
            response.status,
            raw
        );


        if(!response.ok){

            throw new Error(
                "Asset operation HTTP Status: " +
                response.status
            );

        }


        const result =
            JSON.parse(raw);


        if(
            result.body &&
            typeof result.body === "object"
        ){

            if(
                result.body.success === false
            ){

                throw new Error(
                    result.body.message ||
                    "Operation failed."
                );

            }

        }


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Operation failed."
            );

        }


        showMessage(
            editMode
            ? "Asset updated successfully."
            : "Asset added successfully."
        );


        closeAssetModal();


        await loadAssets();

    }
    catch(error){

        console.error(
            "Save Asset:",
            error
        );


        showMessage(
            error.message,
            true
        );

    }
    finally{

        btn.disabled = false;

    }

}


/* =========================================================
   REMOVE
========================================================= */

async function removeAsset(
    id
){

    const asset =
        assets.find(
            x =>
                Number(x.ID) ===
                Number(id)
        );


    if(!asset){

        showMessage(
            "Asset not found.",
            true
        );

        return;

    }


    if(
        !confirm(
            "Are you sure you want to remove " +
            (asset.AssetID || id) +
            "?"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                REMOVE_ASSET_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "removeAsset",

                            ID:
                                id

                        })
                }
            );


        const raw =
            await response.text();


        console.log(
            "REMOVE RESPONSE:",
            response.status,
            raw
        );


        if(!response.ok){

            throw new Error(
                "Remove HTTP Status: " +
                response.status
            );

        }


        const result =
            JSON.parse(raw);


        if(
            result.body &&
            result.body.success === false
        ){

            throw new Error(
                result.body.message ||
                "Remove failed."
            );

        }


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Remove failed."
            );

        }


        showMessage(
            "Asset removed successfully."
        );


        await loadAssets();

    }
    catch(error){

        console.error(
            "Remove Asset:",
            error
        );


        showMessage(
            error.message,
            true
        );

    }

}

/* =========================================================
   HELPERS
========================================================= */

function dateOnly(
    value
){

    if(!value)
        return "";

    return String(value)
        .substring(0,10);

}


function safe(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function showMessage(
    text,
    isError=false
){

    const box =
        document.getElementById(
            "message"
        );


    box.innerText =
        text;


    box.style.background =
        isError
        ? "#dc2626"
        : "#15803d";


    box.style.display =
        "block";


    setTimeout(
        function(){

            box.style.display =
                "none";

        },
        3500
    );

}
