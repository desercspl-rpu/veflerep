<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Asset Management</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
    color:#1f2937;
}

.hidden{
    display:none!important;
}

.header{
    background:#111827;
    color:#fff;
    padding:15px 22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:20px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.container{
    max-width:1450px;
    margin:auto;
    padding:20px;
}

.login-box{
    width:400px;
    max-width:94%;
    margin:80px auto;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.10);
}

.login-box h2{
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:14px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid #d1d5db;
    border-radius:7px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:#fff;
}

.btn-success{
    background:#16a34a;
    color:#fff;
}

.btn-warning{
    background:#d97706;
    color:#fff;
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-secondary{
    background:#6b7280;
    color:#fff;
}

.login-btn{
    width:100%;
    margin-top:8px;
}

.error{
    color:#dc2626;
    font-size:13px;
    margin-top:10px;
}

.dashboard-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.dashboard-title h2{
    font-size:22px;
}

.dashboard-title p{
    color:#6b7280;
    font-size:13px;
    margin-top:4px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card-title{
    color:#6b7280;
    font-size:13px;
}

.card-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.toolbar{
    background:#fff;
    padding:15px;
    border-radius:10px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.search{
    flex:1;
    min-width:250px;
}

.table-box{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1200px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    font-size:12px;
    text-align:left;
}

th{
    background:#f9fafb;
    font-weight:bold;
}

tr:hover{
    background:#f9fafb;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.available{
    background:#dcfce7;
    color:#166534;
}

.assigned{
    background:#dbeafe;
    color:#1e40af;
}

.returned{
    background:#fef3c7;
    color:#92400e;
}

.removed{
    background:#fee2e2;
    color:#991b1b;
}

.default-badge{
    background:#e5e7eb;
    color:#374151;
}

.actions{
    display:flex;
    gap:5px;
}

.small{
    padding:6px 9px;
    font-size:11px;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal-content{
    width:900px;
    max-width:100%;
    max-height:95vh;
    overflow:auto;
    background:#fff;
    border-radius:12px;
    padding:25px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    font-size:27px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.full{
    grid-column:1/-1;
}

.modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.message{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111827;
    color:#fff;
    padding:13px 18px;
    border-radius:8px;
    display:none;
    z-index:3000;
    max-width:350px;
}

@media(max-width:850px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }
}

@media(max-width:550px){

    .cards{
        grid-template-columns:1fr;
    }

    .container{
        padding:10px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
    }

    .login-box{
        margin:40px auto;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage">

    <div class="login-box">

        <h2>IT Asset Management</h2>

        <div class="form-group">

            <label>User ID</label>

            <input
                type="text"
                id="loginUserId"
                placeholder="Enter User ID"
                autocomplete="username">

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                autocomplete="current-password">

        </div>

        <button
            id="loginButton"
            class="btn btn-primary login-btn"
            onclick="loginUser()">

            Login

        </button>

        <div id="loginMessage"></div>

    </div>

</div>


<!-- =====================================================
     MAIN APPLICATION
===================================================== -->

<div id="application" class="hidden">

    <div class="header">

        <h1>IT Asset Management</h1>

        <div class="user-area">

            <span id="loggedUser"></span>

            <button
                class="btn btn-danger"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>


    <div class="container">

        <div class="dashboard-title">

            <div>

                <h2>Asset Dashboard</h2>

                <p>
                    Add, update and remove IT assets
                </p>

            </div>

            <button
                class="btn btn-success"
                onclick="openAddModal()">

                + Add Asset

            </button>

        </div>


        <!-- CARDS -->

        <div class="cards">

            <div class="card">

                <div class="card-title">
                    Total Assets
                </div>

                <div
                    class="card-value"
                    id="totalAssets">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Available
                </div>

                <div
                    class="card-value"
                    id="availableAssets">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Assigned
                </div>

                <div
                    class="card-value"
                    id="assignedAssets">

                    0

                </div>

            </div>


            <div class="card">

                <div class="card-title">
                    Removed
                </div>

                <div
                    class="card-value"
                    id="removedAssets">

                    0

                </div>

            </div>

        </div>


        <!-- SEARCH -->

        <div class="toolbar">

            <input
                class="search"
                type="text"
                id="searchBox"
                placeholder="Search Asset ID, Tag, Brand, Model, Serial Number..."
                oninput="filterAssets()">


            <select
                id="statusFilter"
                onchange="filterAssets()">

                <option value="">
                    All Status
                </option>

                <option value="Available">
                    Available
                </option>

                <option value="Assigned">
                    Assigned
                </option>

                <option value="Returned">
                    Returned
                </option>

                <option value="Removed">
                    Removed
                </option>

            </select>


            <button
                class="btn btn-primary"
                onclick="loadAssets()">

                Refresh

            </button>

        </div>


        <!-- TABLE -->

        <div class="table-box">

            <div
                id="tableLoading"
                class="loading">

                Loading assets...

            </div>


            <table
                id="assetTable"
                class="hidden">

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Asset ID</th>
                        <th>Asset Tag</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Serial Number</th>
                        <th>Category</th>
                        <th>Location</th>
                        <th>Department</th>
                        <th>Status</th>
                        <th>Condition</th>
                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="assetTableBody"></tbody>

            </table>

        </div>

    </div>

</div>


<!-- =====================================================
     ADD / UPDATE MODAL
===================================================== -->

<div
    id="assetModal"
    class="modal hidden">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                Add Asset
            </h2>

            <span
                class="close"

                &times;

            </span>

        </div>


        <input
            type="hidden"
            id="assetID">


        <div class="form-grid">


            <div class="form-group">

                <label>Asset ID *</label>

                <input
                    id="assetAssetID"
                    placeholder="AST-0002">

            </div>


            <div class="form-group">

                <label>Asset Tag *</label>

                <input
                    id="assetTag"
                    placeholder="IT-LAP-0002">

            </div>


            <div class="form-group">

                <label>Brand *</label>

                <input
                    id="assetBrand"
                    placeholder="Dell">

            </div>


            <div class="form-group">

                <label>Model *</label>

                <input
                    id="assetModel"
                    placeholder="Latitude 5440">

            </div>


            <div class="form-group">

                <label>Serial Number *</label>

                <input
                    id="assetSerialNumber">

            </div>


            <div class="form-group">

                <label>Purchase Date</label>

                <input
                    type="date"
                    id="assetPurchaseDate">

            </div>


            <div class="form-group">

                <label>Purchase Cost</label>

                <input
                    type="number"
                    id="assetPurchaseCost">

            </div>


            <div class="form-group">

                <label>Warranty Start</label>

                <input
                    type="date"

            </div>


            <div class="form-group">

            </div>


            <div class="form-group">

                <label>Status</label>

                <select id="assetStatus">

                    <option value="Available">
                        Available
                    </option>

                    <option value="Assigned">
                        Assigned
                    </option>

                    <option value="Returned">
                        Returned
                    </option>

                    <option value="Removed">
                        Removed

                </select>

            </div>


            <div class="form-group">

                <label>Condition</label>

                <select id="assetCondition">

                    <option value="New">
                        New
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Fair">

                    <option value="Poor">

                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Asset Category</label>

                <select id="assetCategory">

                    <option value="Laptop">
                        Laptop
                    </option>

                    <option value="Desktop">
                        Desktop
                    </option>

                    <option value="Monitor">
                        Monitor
                    </option>

                    <option value="Printer">
                        Printer
                    </option>

                    <option value="Mobile">
                        Mobile
                    </option>

                    <option value="Tablet">
                        Tablet
                    </option>

                    <option value="Network">
                        Network
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Asset Location</label>

                <input
                    id="assetLocation"
                    placeholder="Head Office">

            </div>


            <div class="form-group">

                <label>Asset Vendor</label>

                <input
                    id="assetVendor"
                    placeholder="ABC IT Solutions">

            </div>


            <div class="form-group">

                <label>Asset Department</label>

                <input
                    id="assetDepartment"
                    placeholder="Information Technology">

            </div>


            <div class="form-group full">

                <label>Remarks</label>

                <textarea
                    id="assetRemarks"

            </div>

        </div>


        <div class="modal-footer">

            <button

            <button

                onclick="saveAsset()">

                Save Asset

            </button>

        </div>

    </div>

</div>


<div
    id="message"
    class="message">
</div>


<script>

/* =====================================================
   PUT YOUR POWER AUTOMATE URLS HERE
===================================================== */

const LOGIN_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/16/workflows/382c1f3775a94fbcb1ab9874e2fab95f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=msJRa_nx4WGByT8aJNQoi-a3j1818bl_vVC_xV1H_mE";


const GET_ASSETS_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/46efdd64086b4ddf9cd9e341b13bb880/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oRsQsA92R3Ajybn3NQGPNnyWB3JaOEeGnX6qDCAhSb8";


const ADD_ASSET_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/8eaed4c3a0f54577952bfe9b97c87968/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=vxFwTKRoT9eyLNAzb_J_FXnYXqlMtm1cCEGjSU-LeXw";


const UPDATE_ASSET_URL =
"https://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/26/workflows/e6151d7a9a4747789d0b8913069569e3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=yUZy7wczskVTlLFrzin7jlVD07-lgOc9sh6sYZ9Wu6w";


const REMOVE_ASSET_URL =
"Phttps://default7055ba6336ec48e083eb932bb1602d.a1.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/17/workflows/344acde135574fabb4a31bc2c445847e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=t-ttWl_mRRYxEC02e-mQAkF9gXPJ_piFrEZlRgxUP_I";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let allAssets = [];

let currentUser = null;

let editingAsset = null;


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(){

    const userId =
        document.getElementById(
            "loginUserId"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const button =
        document.getElementById(
            "loginButton"
        );


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!userId || !password){

        message.className = "error";

        message.innerText =
            "Enter User ID and Password.";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Logging in...";


    try{

        /*
         * IMPORTANT:
         * Existing Login Flow format
         */

        const response =
            await fetch(
                LOGIN_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:"login",

                        UserID:userId,

                        Password:password

                    })
                }
            );


        if(!response.ok){

            throw new Error(
                "Login HTTP Status: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "LOGIN RESPONSE:",
            result
        );


        if(result.success !== true){

            throw new Error(
                result.message ||
                "Invalid User ID or Password"
            );

        }


        currentUser =
            result.user ||
            result.data ||
            {};


        document
            .getElementById("loginPage")
            .classList.add("hidden");


        document
            .getElementById("application")
            .classList.remove("hidden");


        document
            .getElementById("loggedUser")
            .innerText =
                currentUser.Name ||
                currentUser.UserID ||
                userId;


        await loadAssets();

    }
    catch(error){

        console.error(
            "Login Error:",
            error
        );


        message.className =
            "error";


        message.innerText =
            error.message ||
            "Login failed.";

    }
    finally{

        button.disabled = false;

        button.innerText =
            "Login";

    }

}


/* =====================================================
   LOAD ASSETS
===================================================== */

async function loadAssets(){

    const loading =
        document.getElementById(
            "tableLoading"
        );


    const table =
        document.getElementById(
            "assetTable"
        );


    loading.classList.remove(
        "hidden"
    );


    table.classList.add(
        "hidden"
    );


    try{

        const response =
            await fetch(
                GET_ASSETS_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        action:"getAssets"
                    })
                }
            );


        if(!response.ok){

            throw new Error(
                "Assets HTTP Status: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "ASSETS RESPONSE:",
            result
        );


        /*
         * Supports your current response:
         *
         * {
         *   success:true,
         *   data:[]
         * }
         */


        if(
            result &&
            result.success === true &&
            Array.isArray(result.data)
        ){

            allAssets =
                result.data;

        }

        else if(
            result &&
            Array.isArray(result.value)
        ){

            allAssets =
                result.value;

        }

        else if(
            result &&
            result.body &&
            Array.isArray(
                result.body.data
            )
        ){

            allAssets =
                result.body.data;

        }

        else if(
            result &&
            result.body &&
            Array.isArray(
                result.body.value
            )
        ){

            allAssets =
                result.body.value;

        }

        else{

            allAssets = [];

        }


        renderAssets(
            allAssets
        );


        updateCards(
            allAssets
        );

    }
    catch(error){

        console.error(
            "loadAssets Error:",
            error
        );


        showMessage(
            error.message,
            true
        );

    }
    finally{

        loading.classList.add(
            "hidden"
        );

        table.classList.remove(
            "hidden"
        );

    }

}


/* =====================================================
   GET CHOICE VALUE
===================================================== */

function getValue(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    if(
        typeof value === "object"
    ){

        return value.Value ||
               value.value ||
               value.Title ||
               value.Name ||
               "";

    }


    return value;

}


/* =====================================================
   RENDER ASSETS
===================================================== */

function renderAssets(
    assets
){

    const tbody =
        document.getElementById(
            "assetTableBody"
        );


    tbody.innerHTML = "";


    if(!assets.length){

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="12"
                    style="text-align:center;padding:30px;">

                    No assets found

                </td>

            </tr>

        `;

        return;

    }


    assets.forEach(
        asset => {

            const status =
                getValue(
                    asset.Status
                );


            const condition =
                getValue(
                    asset.Condition
                );


            const category =
                getValue(
                    asset.AssetCategory
                );


            const location =
                getValue(
                    asset.AssetLocation
                );


            const department =
                getValue(
                    asset.AssetDepartment
                );


            const row =
                document.createElement(
                    "tr"
                );


            row.innerHTML = `

                <td>
                    ${safe(asset.ID)}
                </td>

                <td>
                    <strong>
                        ${safe(asset.AssetID)}
                    </strong>
                </td>

                <td>
                    ${safe(asset.AssetTag)}
                </td>

                <td>
                    ${safe(asset.Brand)}
                </td>

                <td>
                    ${safe(asset.Model)}
                </td>

                <td>
                    ${safe(asset.SerialNumber)}
                </td>

                <td>
                    ${safe(category)}
                </td>

                <td>
                    ${safe(location)}
                </td>

                <td>
                    ${safe(department)}
                </td>

                <td>
                    ${statusBadge(status)}
                </td>

                <td>
                    ${safe(condition)}
                </td>

                <td>

                    <div class="actions">

                        <button
                            class="btn btn-warning small"
                            onclick="editAsset(${Number(asset.ID)})">

                            Edit

                        </button>


                        <button
                            class="btn btn-danger small"
                            onclick="removeAsset(${Number(asset.ID)})">

                            Remove

                        </button>

                    </div>

                </td>

            `;


            tbody.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   STATUS BADGE
===================================================== */

function statusBadge(
    status
){

    const s =
        String(status || "")
        .toLowerCase();


    let cls =
        "default-badge";


    if(s === "available")
        cls = "available";

    else if(s === "assigned")
        cls = "assigned";

    else if(s === "returned")
        cls = "returned";

    else if(s === "removed")
        cls = "removed";


    return `

        <span class="badge ${cls}">

            ${safe(status)}

        </span>

    `;

}

){

        ).length;

/* =====================================================
   SEARCH
===================================================== */

function filterAssets(){

    const search =
        document.getElementById(
            "searchBox"
        )
        .value
        .toLowerCase()
        .trim();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        allAssets.filter(
            asset => {

                const text = [

                    asset.AssetID,

                    asset.AssetTag,

                    asset.Brand,

                    asset.Model,

                    asset.SerialNumber,

                    getValue(
                        asset.AssetCategory
                    ),

                    getValue(
                        asset.AssetLocation
                    ),

                    getValue(
                        asset.AssetDepartment
                    )

                ]
                .join(" ")
                .toLowerCase();


                const searchOK =
                    text.includes(
                        search
                    );


                const statusOK =
                    !status ||
                    getValue(
                        asset.Status
                    ) === status;


                return (
                    searchOK &&
                    statusOK
                );

            }
        );


    renderAssets(
        filtered
    );

}

            true

    editingAsset =

/* =====================================================
   ADD / UPDATE
===================================================== */

async function saveAsset(){

    const button =
        document.getElementById(
            "saveAssetButton"
        );


    const data = {

        ID:
            document.getElementById(
                "assetID"
            ).value,

        AssetID:
            document.getElementById(
                "assetAssetID"
            ).value.trim(),

        AssetTag:
            document.getElementById(
                "assetTag"
            ).value.trim(),

        Brand:
            document.getElementById(
                "assetBrand"
            ).value.trim(),

        Model:
            document.getElementById(
                "assetModel"
            ).value.trim(),

        SerialNumber:
            document.getElementById(
                "assetSerialNumber"
            ).value.trim(),

        PurchaseDate:
            document.getElementById(
                "assetPurchaseDate"
            ).value,

        PurchaseCost:
            Number(
                document.getElementById(
                    "assetPurchaseCost"
                ).value || 0
            ),

        WarrantyStart:
            document.getElementById(
                "assetWarrantyStart"
            ).value,

        WarrantyEnd:
            document.getElementById(
                "assetWarrantyEnd"
            ).value,

        Status:
            document.getElementById(
                "assetStatus"
            ).value,

        Condition:
            document.getElementById(
                "assetCondition"
            ).value,

        AssetCategory:
            document.getElementById(
                "assetCategory"
            ).value,

        AssetLocation:
            document.getElementById(
                "assetLocation"
            ).value.trim(),

        AssetVendor:
            document.getElementById(
                "assetVendor"
            ).value.trim(),

        AssetDepartment:
            document.getElementById(
                "assetDepartment"
            ).value.trim(),

        Remarks:
            document.getElementById(
                "assetRemarks"
            ).value.trim()

    };


    if(
        !data.AssetID ||
        !data.AssetTag ||
        !data.Brand ||
        !data.Model ||
        !data.SerialNumber
    ){

        showMessage(
            "Please fill all required fields.",
            true
        );

        return;

    }


    button.disabled = true;


    try{

        const url =
            editingAsset
            ? UPDATE_ASSET_URL
            : ADD_ASSET_URL;


        const body =
            editingAsset

            ? {
                action:"updateAsset",
                ...data
            }

            : {
                action:"addAsset",
                ...data
            };


        const response =
            await fetch(
                url,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            body
                        )
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP Status: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "ADD/UPDATE RESPONSE:",
            result
        );


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Operation failed."
            );

        }


        showMessage(
            editingAsset
            ? "Asset updated successfully."
            : "Asset added successfully."
        );


        closeModal();


        await loadAssets();

    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Operation failed.",
            true
        );

    }
    finally{

        button.disabled =
            false;

    }

}


/* =====================================================
   REMOVE
===================================================== */

async function removeAsset(
    id
){

    const asset =
        allAssets.find(
            a =>
                Number(a.ID) ===
                Number(id)
        );


    if(!asset){

        showMessage(
            "Asset not found.",
            true
        );

        return;

    }


    const confirmed =
        confirm(
            "Remove " +
            (
                asset.AssetID ||
                "Asset ID " + id
            ) +
            "?"
        );


    if(!confirmed)
        return;


    const reason =
        prompt(
            "Enter removal reason:",
            "Asset removed"
        );


    if(reason === null)
        return;


    try{

        const response =
            await fetch(
                REMOVE_ASSET_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            action:
                                "removeAsset",

                            ID:id,

                            Remarks:
                                reason

                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "Remove HTTP Status: " +
                response.status
            );

        }


        const result =
            await response.json();


        console.log(
            "REMOVE RESPONSE:",
            result
        );


        if(
            result.success === false
        ){

            throw new Error(
                result.message ||
                "Remove failed."
            );

        }


        showMessage(
            "Asset removed successfully."
        );


        await loadAssets();

    }
    catch(error){

        console.error(
            error
        );


        showMessage(
            error.message ||
            "Remove failed.",
            true
        );

    }

}

/* =====================================================
   HELPERS
===================================================== */

function formatDate(
    value
){

    if(!value)
        return "";

    return String(value)
        .substring(0,10);

}


function safe(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


function showMessage(
    text,
    error=false
){

    const box =
        document.getElementById(
            "message"
        );


    box.innerText =
        text;


    box.style.background =
        error
        ? "#dc2626"
        : "#15803d";


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        3500
    );

}

   ENTER KEY LOGIN

document

    )

        function(e){

            if(
                e.key === "Enter"
            ){

            }

        }
